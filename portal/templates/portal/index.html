<body>
    <h1>Console de Surveillance DevOps</h1>

    <div style="border: 2px solid #28a745; padding: 20px; margin-bottom: 20px;">
        <p>STATUT SYSTÈME : <strong>Opérationnel</strong></p>
    </div>

    <div style="border: 2px solid #555; padding: 20px; background-color: #f8f9fa;">
        <h3>Zone de Test - Sprint Monitoring</h3>
        <p>Action utilisateur : <em>Mettre à jour les statistiques (Bêta)</em></p>

        <button id="refresh-data" type="button" style="padding: 10px 20px; cursor: pointer; font-weight: bold;">
            Actualiser les données
        </button>

        <p id="error-message" style="color: orange; font-size: 0.9em; {% if not error %}display: none;{% endif %}">
            Erreur de connexion au serveur de données. Veuillez réessayer.
        </p>
    </div>

    <script>
        const refreshButton = document.getElementById('refresh-data');
        const errorMessage = document.getElementById('error-message');

        refreshButton.addEventListener('click', async () => {
            await fetch("{% url 'sentry_debug' %}", {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            errorMessage.style.display = 'block';
        });
    </script>
</body>
